name: Build Containers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Lint shell scripts and rendered chezmoi templates
  shellcheck:
    runs-on: ubuntu-latest
    name: Shellcheck
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install chezmoi
      run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
    - name: Run shellcheck
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        make shellcheck

  # Detect if Dockerfile.dev changed
  check-dev:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.dev }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Check for Dockerfile.dev changes
      uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          dev:
            - 'build/Dockerfile.dev'

  # Build Ubuntu Container
  build-ubuntu:
    runs-on: ubuntu-latest
    name: Build Ubuntu Container (multi-arch)
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Build and push Ubuntu image (multi-arch)
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 \
          -f ./build/Dockerfile.ubuntu \
          -t ghcr.io/${{ github.repository }}/ubuntu-dotfiles:ci-${{ github.run_id }} \
          --push .
    - name: Promote to latest (push to main only)
      if: github.event_name == 'push'
      run: |
        docker buildx imagetools create \
          -t ghcr.io/${{ github.repository }}/ubuntu-dotfiles:latest \
          ghcr.io/${{ github.repository }}/ubuntu-dotfiles:ci-${{ github.run_id }}

  # Build Amazon Container
  build-amazon:
    runs-on: ubuntu-latest
    name: Build Amazon Container (multi-arch)
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Build and push Amazon image (multi-arch)
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 \
          -f ./build/Dockerfile.amazon \
          -t ghcr.io/${{ github.repository }}/amazon-dotfiles:ci-${{ github.run_id }} \
          --push .
    - name: Promote to latest (push to main only)
      if: github.event_name == 'push'
      run: |
        docker buildx imagetools create \
          -t ghcr.io/${{ github.repository }}/amazon-dotfiles:latest \
          ghcr.io/${{ github.repository }}/amazon-dotfiles:ci-${{ github.run_id }}

  # Build Dev Container
  build-dev:
    runs-on: ubuntu-latest
    name: Build Dev Container
    needs: check-dev
    if: needs.check-dev.outputs.changed == 'true'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Build and push dev image (single-arch)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./build/Dockerfile.dev
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository }}:dev-ci-${{ github.run_id }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Test Ubuntu Container
  test-ubuntu:
    runs-on: ubuntu-latest
    name: Test Ubuntu Container (multi-arch)
    needs: build-ubuntu
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Load Ubuntu image
      run: |
        docker pull ghcr.io/${{ github.repository }}/ubuntu-dotfiles:ci-${{ github.run_id }}
        docker tag ghcr.io/${{ github.repository }}/ubuntu-dotfiles:ci-${{ github.run_id }} ubuntu-dotfiles:latest
    - name: Run chezmoi installation test
      run: make test-ubuntu

  # Test Amazon Container
  test-amazon:
    runs-on: ubuntu-latest
    name: Test Amazon Container (multi-arch)
    needs: build-amazon
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Load Amazon image
      run: |
        docker pull ghcr.io/${{ github.repository }}/amazon-dotfiles:ci-${{ github.run_id }}
        docker tag ghcr.io/${{ github.repository }}/amazon-dotfiles:ci-${{ github.run_id }} amazon-dotfiles:latest
    - name: Run chezmoi installation test
      run: make test-amazon

  # Test Dev Container
  test-dev:
    runs-on: ubuntu-latest
    name: Test Dev Container
    needs: [check-dev, build-dev]
    if: needs.check-dev.outputs.changed == 'true'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Load dev image
      run: |
        docker pull ghcr.io/${{ github.repository }}:dev-ci-${{ github.run_id }}
        docker tag ghcr.io/${{ github.repository }}:dev-ci-${{ github.run_id }} dev-dotfiles:latest
    - name: Run dev container smoke tests
      run: make test-dev

  # Test Summary
  test-summary:
    runs-on: ubuntu-latest
    needs: [shellcheck, test-ubuntu, test-amazon, test-dev]
    if: always()
    steps:
    - name: Print and Summarize Test Results
      run: |
        # Determine status icons
        if [ "${{ needs.shellcheck.result }}" = "success" ]; then
          SHELLCHECK_ICON="✅"
        else
          SHELLCHECK_ICON="❌"
        fi
        if [ "${{ needs.test-ubuntu.result }}" = "success" ]; then
          UBUNTU_ICON="✅"
        else
          UBUNTU_ICON="❌"
        fi
        if [ "${{ needs.test-amazon.result }}" = "success" ]; then
          AMAZON_ICON="✅"
        else
          AMAZON_ICON="❌"
        fi
        if [ "${{ needs.test-dev.result }}" = "success" ]; then
          DEV_ICON="✅"
        elif [ "${{ needs.test-dev.result }}" = "skipped" ]; then
          DEV_ICON="⏭️"
        else
          DEV_ICON="❌"
        fi

        # Print to console
        echo "================================"
        echo "        TEST RESULTS"
        echo "================================"
        echo ""
        echo "Shellcheck: $SHELLCHECK_ICON ${{ needs.shellcheck.result }}"
        echo "Ubuntu:  $UBUNTU_ICON ${{ needs.test-ubuntu.result }}"
        echo "Amazon:  $AMAZON_ICON ${{ needs.test-amazon.result }}"
        echo "Dev:     $DEV_ICON ${{ needs.test-dev.result }}"
        echo ""
        echo "================================"

        # Write to GitHub Step Summary
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Container | Status | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Shellcheck | $SHELLCHECK_ICON | ${{ needs.shellcheck.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Ubuntu | $UBUNTU_ICON | ${{ needs.test-ubuntu.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Amazon | $AMAZON_ICON | ${{ needs.test-amazon.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Dev | $DEV_ICON | ${{ needs.test-dev.result }} |" >> $GITHUB_STEP_SUMMARY

    - name: Check for failures
      if: needs.shellcheck.result != 'success' || needs.test-ubuntu.result != 'success' || needs.test-amazon.result != 'success' || (needs.test-dev.result != 'success' && needs.test-dev.result != 'skipped')
      run: |
        echo "One or more tests failed!"
        exit 1

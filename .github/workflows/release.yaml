name: Release Dev Container

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CalVer version (e.g. 2026.04.0)'
        required: true
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:

  # Build multi-arch image and push with a CI tag for testing
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      month: ${{ steps.ver.outputs.month }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          MONTH="${V%.*}"   # strip patch: 2026.04.0 → 2026.04
          echo "version=${V}" >> $GITHUB_OUTPUT
          echo "month=${MONTH}" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:ci-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Smoke test against the CI image before publishing
  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Load dev image
        run: |
          docker pull ${{ env.IMAGE }}:ci-${{ github.run_id }}
          docker tag ${{ env.IMAGE }}:ci-${{ github.run_id }} dev-dotfiles:latest

      - name: Run smoke tests
        run: make test-dev

  # Promote CI image to release tags and create GitHub Release
  publish:
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: write   # create git tag + GitHub Release
      packages: write   # push release tags to GHCR

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for git tag

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Promote CI image to release tags
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ needs.build.outputs.version }} \
            --tag ${{ env.IMAGE }}:${{ needs.build.outputs.month }} \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:ci-${{ github.run_id }}

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.build.outputs.version }}
          git push origin ${{ needs.build.outputs.version }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: "Dev Container ${{ needs.build.outputs.version }}"
          generate_release_notes: true
          body: |
            Pull: `docker pull ghcr.io/jalexandercarr/dotfiles:${{ needs.build.outputs.version }}`

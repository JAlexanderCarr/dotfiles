# ~/.tmux.conf - sane defaults for tmux across Linux and macOS

# --- Prefix ---
# Keep the default C-b prefix (no readline/terminal conflicts), but make it
# responsive: tmux's default escape-time adds a noticeable lag to every
# prefix keystroke and to <Esc> in vi-mode editors like neovim.
set -sg escape-time 0
set -g prefix C-b
bind C-b send-prefix

# --- General behavior ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on

# --- Truecolor ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc"

# --- vi copy-mode ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# --- Splits and panes ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# --- Status line ---
# Mirrors the shell prompt's palette: yellow for git branch, green for
# user@host, white/default for everything else.
set -g status-interval 5
set -g status-style "default"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=green,bold]#S #[fg=default]"
set -g status-right "#[fg=yellow]#(cd #{pane_current_path} && git symbolic-ref --short HEAD 2>/dev/null || git describe --tags --exact-match 2>/dev/null) #[fg=green]#h #[fg=white]%H:%M"

setw -g window-status-current-style "fg=black,bg=green,bold"
